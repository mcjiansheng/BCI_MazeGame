[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bci-maze-eeg"
version = "0.1.0"
description = "BCIC IV 2a preprocessing and EEG model baselines for the BCI Maze project"
requires-python = ">=3.10"
dependencies = [
  "mne==1.8.0",
  "numpy>=1.26,<3",
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "torch>=2.1",
  "brainflow>=5.18,<6",
  "pylsl>=1.17,<2",
  "matplotlib>=3.8",
  "joblib>=1.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
